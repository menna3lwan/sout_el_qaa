name: sout_el_qaa
description: "صوت القاع — المنصة الرسمية لشكاوى سكان قاع الهامور."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.7.0

  # Routing
  go_router: ^14.2.7

  # Networking
  dio: ^5.6.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.5

  # Functional / Error handling
  fpdart: ^1.1.0

  # Local Storage
  # [Removed, Full Application Review pass, 28 Aug 2026] shared_preferences had zero usage anywhere
  # in lib/ (confirmed via a full-tree search) and no doc comment anywhere marking it as prepared for
  # near-term use, unlike freezed_annotation/json_annotation below — SecureStorageService (tokens,
  # user id) uses flutter_secure_storage exclusively, and LocalCacheService (PLAN.md section 1.8: "simple
  # flags belong in shared_preferences, not [secure storage]") never actually got a caller needing that.
  # Removed rather than left in "for later" (Important Rule #5: no unnecessary packages); trivial to
  # re-add the one line once a feature actually needs a simple non-sensitive flag.
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # Map & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Media
  # [Removed, Full Application Review pass, 28 Aug 2026] flutter_image_compress had zero usage
  # anywhere in lib/ (confirmed via a full-tree search) — attachPhoto() in CreateComplaintCubit
  # uploads image_picker's raw file path as-is, with no compression step ever wired in. Removed
  # rather than left "for later": an unused dependency in pubspec.yaml is exactly what Important
  # Rule #5 ("no unnecessary packages") flags, and re-adding it costs one line whenever a real
  # compression step is actually implemented.
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Localization
  # Deliberately left as "any" — flutter_localizations forces an exact intl version tied to your Flutter SDK, and any version pinned here would likely conflict; `flutter pub get` resolves the right number automatically.
  intl: any

  # Typography
  # [P — Proposed, Figma foundation session, 24 Aug 2026] the real Figma uses 3 real fonts (Baloo Bhaijaan 2 / Cairo / Be Vietnam Pro), not the default system font; google_fonts is the simplest way to get them, with Arabic support. The alternative (manually bundling .ttf files under flutter/fonts) is available later if offline-from-first-run is required — see the branch report for font details.
  google_fonts: ^6.2.1

  # Utils
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # No @HiveType class is used yet (local_cache_service.dart only calls Hive.initFlutter()); hive_generator
  # returns once Hive codegen is actually needed.
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true # Required to generate l10n files from ARB (l10n.yaml)

  # Figma Assets Extraction pass (2026-08-25): raster assets actually present in the Figma file
  # (character avatars, complaint scene photos, the location map illustration), extracted and
  # organized by content type. Fonts are still added later once real font files are bundled.
  assets:
    - assets/images/characters/
    - assets/images/complaints/
    - assets/images/map/
